<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        integrity="sha512-iecdLmaskl7CVkqkXNQ/ZmCULaMxtu1r+TlT6vq0nLMwNLD69Npy4HI+N9+VbYdIhO7tBvZc2oM/gI1w=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="globals.css">
    <!-- <script src="js/script.js" defer></script> -->
    <div class="auth-container">
        <!-- Login Form -->
        <div class="form-container-login" id="loginForm">
            <div class="form-slide active">
                <div class="breadcrumb">
                    <a href="#" onclick="goHome()">Trang chủ</a> > Lấy lại mật khẩu
                </div>

                <div class="form-header">
                    <h2 class="form-title">Đăng nhập tài khoản</h2>
                    <p class="form-subtitle">Nhập email và mật khẩu của bạn</p>
                </div>

                <div class="success-message" id="loginSuccess"></div>
                <div class="error-message" id="loginError"></div>

                <form id="loginFormElement" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <input type="email" class="form-input" placeholder="Email" required id="loginEmail">
                    </div>

                    <div class="form-group">
                        <input type="password" class="form-input" placeholder="Mật khẩu mới" required
                            id="loginPassword">
                    </div>
                    <div class="form-group">
                        <input type="password" class="form-input" placeholder="Xác nhận mật khẩu" required
                            id="loginPassword">
                    </div>
                    <button type="submit" class="btn-primary" id="loginBtn">
                        Đăng nhập
                    </button>
                </form>
            </div>
        </div>
